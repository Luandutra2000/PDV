<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff6b1a">
  <title>PDV Lanchonete</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/layout.css">
  <link rel="stylesheet" href="./src/styles/sidebar.css">
  <link rel="stylesheet" href="./src/styles/buttons.css">
  <link rel="stylesheet" href="./src/styles/cards.css">
  <link rel="stylesheet" href="./src/styles/modal.css">
  <link rel="stylesheet" href="./src/styles/forms.css">
  <link rel="stylesheet" href="./src/styles/pdv.css">
  <link rel="stylesheet" href="./src/styles/mobile.css">
</head>
<body>
  <div id="app" class="app-shell">
    <section class="login-screen">
      <form class="login-card" aria-label="Login do PDV" onsubmit="return false">
        <div>
          <p class="module-subtitle">PDV</p>
          <h1 class="pdv-title">Entrar no PDV</h1>
        </div>
        <label class="field-group">
          <span>Usuario</span>
          <input class="field" type="text" name="username" autocomplete="username">
        </label>
        <label class="field-group">
          <span>Senha</span>
          <input class="field" type="password" name="password" autocomplete="current-password">
        </label>
        <button class="button" type="submit">Entrar</button>
      </form>
    </section>
  </div>
  <div class="toast-root" aria-live="polite"></div>
  <script type="module">
    const LOCAL_CACHE_VERSION = '20260601-12-supabase-rest-auth';

    async function clearLocalDevelopmentCaches() {
      if (!['127.0.0.1', 'localhost'].includes(window.location.hostname)) {
        return;
      }

      if (window.sessionStorage.getItem('pdv.localCacheVersion') === LOCAL_CACHE_VERSION) {
        return;
      }

      window.sessionStorage.setItem('pdv.localCacheVersion', LOCAL_CACHE_VERSION);

      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }

      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
      }

      return true;
    }

    await clearLocalDevelopmentCaches();
    await import('./src/app.js?v=20260601-12');
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      const isLocalDevelopment = ['127.0.0.1', 'localhost'].includes(window.location.hostname);

      if (isLocalDevelopment) {
        navigator.serviceWorker.getRegistrations()
          .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())));
      } else {
      let refreshedByServiceWorker = false;

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshedByServiceWorker) {
          return;
        }

        refreshedByServiceWorker = true;
        window.location.reload();
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then((registration) => registration.update());
      });
      }
    }
  </script>
</body>
</html>
