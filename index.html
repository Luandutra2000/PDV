<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ff6b1a">
  <title>PDV Lanchonete</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/layout.css">
  <link rel="stylesheet" href="./src/styles/sidebar.css">
  <link rel="stylesheet" href="./src/styles/buttons.css">
  <link rel="stylesheet" href="./src/styles/cards.css">
  <link rel="stylesheet" href="./src/styles/modal.css">
  <link rel="stylesheet" href="./src/styles/forms.css">
  <link rel="stylesheet" href="./src/styles/empresa-config.css">
  <link rel="stylesheet" href="./src/styles/pdv.css">
  <link rel="stylesheet" href="./src/styles/mobile.css">
  <link rel="stylesheet" href="./src/styles/redesign.css?v=20260807-48">
</head>
<body>
  <div id="app" class="app-shell">
    <div class="bubble-background bubble-background--interactive" data-bubble-background aria-hidden="true">
      <div class="bubble-background__glow bubble-background__glow--first"></div>
      <div class="bubble-background__glow bubble-background__glow--second"></div>
      <div class="bubble-background__glow bubble-background__glow--third"></div>
      <div class="bubble-background__glow bubble-background__glow--fourth"></div>
      <div class="bubble-background__glow bubble-background__glow--fifth"></div>
      <div class="bubble-background__glow bubble-background__glow--sixth"></div>
    </div>
    <section class="login-screen">
      <form class="login-card" data-login-form aria-label="Login do PDV" onsubmit="return false">
        <div class="login-card__brand">
          <span class="login-card__logo" aria-hidden="true">S</span>
          <h1 aria-label="Entrar no PDV">Welcome Back</h1>
          <p>Sign in to continue to PDV Lanchonete</p>
        </div>
        <label class="field-group">
          <span class="login-field-label">Usuario</span>
          <span class="login-input-wrap">
            <span class="login-input-icon" aria-hidden="true">✉</span>
            <input class="field" type="text" name="username" placeholder="Email address" required autocomplete="username">
          </span>
        </label>
        <label class="field-group">
          <span class="login-field-label">Senha</span>
          <span class="login-input-wrap">
            <span class="login-input-icon" aria-hidden="true">♙</span>
            <input class="field" type="password" name="password" placeholder="Password" required autocomplete="current-password">
          </span>
        </label>
        <div class="login-card__options">
          <label class="login-remember"><input type="checkbox" name="remember"> <span>Remember me</span></label>
          <span class="login-link login-link--muted">Forgot password?</span>
        </div>
        <button class="button login-submit" type="submit">Entrar</button>
        <div class="login-divider"><span></span><small>or</small><span></span></div>
        <button class="login-google" type="button"><strong>G</strong><span>Sign in with Google</span></button>
        <p class="login-signup">Don&apos;t have an account? <span class="login-link">Sign up</span></p>
        <p class="form-error" data-login-error hidden></p>
      </form>
    </section>
  </div>
  <div class="toast-root" aria-live="polite"></div>
  <script type="module">
    const LOCAL_CACHE_VERSION = '20260807-03-current-login';

    async function clearStaleClientCaches() {
      try {
        if (window.sessionStorage.getItem('pdv.localCacheVersion') === LOCAL_CACHE_VERSION) {
          return false;
        }

        window.sessionStorage.setItem('pdv.localCacheVersion', LOCAL_CACHE_VERSION);
      } catch (error) {
        console.warn('Nao foi possivel ler a versao de cache local.', error);
      }

      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
      } catch (error) {
        console.warn('Nao foi possivel limpar service workers antigos.', error);
      }

      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
      } catch (error) {
        console.warn('Nao foi possivel limpar caches antigos.', error);
      }

      return true;
    }

    try {
      await clearStaleClientCaches();
      await import('./src/app.js?v=20260804-06');
    } catch (error) {
      console.error('Nao foi possivel iniciar o PDV.', error);
      const app = document.getElementById('app');
      if (app) {
        app.innerHTML = `
          <section class="login-screen">
            <div class="login-card">
              <p class="module-subtitle">PDV</p>
              <h1 class="pdv-title">Erro ao iniciar</h1>
              <p class="form-error">Atualize a pagina. Se continuar, limpe o cache do navegador.</p>
              <button class="button" type="button" onclick="window.location.reload()">Atualizar</button>
            </div>
          </section>
        `;
      }
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      const isLocalDevelopment = ['127.0.0.1', 'localhost'].includes(window.location.hostname);

      if (isLocalDevelopment) {
        navigator.serviceWorker.getRegistrations()
          .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())));
      } else {
      let refreshedByServiceWorker = false;

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshedByServiceWorker) {
          return;
        }

        refreshedByServiceWorker = true;
        window.location.reload();
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then((registration) => registration.update());
      });
      }
    }
  </script>
</body>
</html>
