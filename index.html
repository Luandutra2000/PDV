<body>
  <div id="app" class="app-shell">
    <section class="lg" aria-label="Entrar no PDV">
      <aside class="lg-side">
        <span class="lg-brand" aria-hidden="true">P</span>
        <div class="lg-side__text">
          <p class="lg-side__name">PDV Lanchonete</p>
          <p class="lg-side__tagline">Frente de caixa, vitrine e financeiro num lugar só.</p>
        </div>
        <div class="lg-side__cats" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      </aside>
      <div class="lg-main">
        <form class="lg-card" data-login-form aria-label="Login do PDV" onsubmit="return false">
          <h1 class="lg-card__title">Entrar no PDV</h1>
          <p class="lg-card__hint">Use o e-mail e a senha que o administrador cadastrou.</p>
          <div class="ui-field">
            <label for="lg-username">E-mail</label>
            <input class="ui-input lg-input" id="lg-username" type="text" name="username" required autocomplete="username" autocapitalize="none" spellcheck="false">
          </div>
          <div class="ui-field">
            <label for="lg-password">Senha</label>
            <input class="ui-input lg-input" id="lg-password" type="password" name="password" required autocomplete="current-password">
          </div>
          <button class="ui-btn ui-btn--primary lg-submit" type="submit">Entrar</button>
          <p class="lg-error" data-login-error role="alert" hidden></p>
          <p class="lg-card__help">Esqueceu a senha? Fale com o administrador.</p>
        </form>
      </div>
    </section>
  </div>
  <div class="toast-root" aria-live="polite"></div>
  <script type="module">
    const LOCAL_CACHE_VERSION = '20260807-03-current-login';

    async function clearStaleClientCaches() {
      try {
        if (window.sessionStorage.getItem('pdv.localCacheVersion') === LOCAL_CACHE_VERSION) {
          return false;
        }

        window.sessionStorage.setItem('pdv.localCacheVersion', LOCAL_CACHE_VERSION);
      } catch (error) {
        console.warn('Nao foi possivel ler a versao de cache local.', error);
      }

      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
      } catch (error) {
        console.warn('Nao foi possivel limpar service workers antigos.', error);
      }

      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
      } catch (error) {
        console.warn('Nao foi possivel limpar caches antigos.', error);
      }

      return true;
    }

    try {
      await clearStaleClientCaches();
      await import('./src/app.js?v=20260807-16');
    } catch (error) {
      console.error('Nao foi possivel iniciar o PDV.', error);
      const app = document.getElementById('app');
      if (app) {
        app.innerHTML = `
          <section class="lg">
            <aside class="lg-side"><span class="lg-brand" aria-hidden="true">P</span></aside>
            <div class="lg-main">
              <div class="lg-card">
                <h1 class="lg-card__title">Erro ao iniciar</h1>
                <p class="lg-error">Atualize a pagina. Se continuar, limpe o cache do navegador.</p>
                <button class="ui-btn ui-btn--primary lg-submit" type="button" onclick="window.location.reload()">Atualizar</button>
              </div>
            </div>
          </section>
        `;
      }
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      const isLocalDevelopment = ['127.0.0.1', 'localhost'].includes(window.location.hostname);

      if (isLocalDevelopment) {
        navigator.serviceWorker.getRegistrations()
          .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())));
      } else {
      let refreshedByServiceWorker = false;

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshedByServiceWorker) {
          return;
        }

        refreshedByServiceWorker = true;
        window.location.reload();
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then((registration) => registration.update());
      });
      }
    }
  </script>
</body>
</html>
